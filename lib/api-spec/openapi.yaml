openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: |
    Recruiting Intelligence Framework — control plane API.
    Exposes registries (agents, skills, providers, workflows), memory introspection,
    graph snapshots, reports and the system overview used by the console.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: system
    description: Framework-wide overview and telemetry
  - name: registry
    description: Registered components (agents, skills, providers, workflows)
  - name: memory
    description: Persistent memory introspection
  - name: graph
    description: Candidate and organization graph snapshots
  - name: reports
    description: Generated reports and explanations
  - name: intelligence
    description: Flagship intelligence agent analyses
  - name: cognition
    description: Cross-agent cognitive synthesis (influence, disagreement, uncertainty)
  - name: benchmarks
    description: Cognitive benchmark + smoke-test report (deterministic regression protection)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /system/overview:
    get:
      operationId: getSystemOverview
      tags: [system]
      summary: Framework overview
      description: High-level counts and status across all framework modules
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemOverview"
  /registry/agents:
    get:
      operationId: listAgents
      tags: [registry]
      summary: List registered agents
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
  /registry/skills:
    get:
      operationId: listSkills
      tags: [registry]
      summary: List registered skills
      responses:
        "200":
          description: Skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"
  /registry/providers:
    get:
      operationId: listProviders
      tags: [registry]
      summary: List registered AI providers
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Provider"
  /registry/workflows:
    get:
      operationId: listWorkflows
      tags: [registry]
      summary: List registered workflows
      responses:
        "200":
          description: Workflows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workflow"
  /memory/entries:
    get:
      operationId: listMemoryEntries
      tags: [memory]
      summary: Recent persistent memory entries
      responses:
        "200":
          description: Memory entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemoryEntry"
  /graph/candidate:
    get:
      operationId: getCandidateGraph
      tags: [graph]
      summary: Candidate graph snapshot
      responses:
        "200":
          description: Graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphSnapshot"
  /graph/organization:
    get:
      operationId: getOrganizationGraph
      tags: [graph]
      summary: Organization graph snapshot
      responses:
        "200":
          description: Graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphSnapshot"
  /intelligence/analyses:
    get:
      operationId: listIntelligenceAnalyses
      tags: [intelligence]
      summary: List candidate intelligence analyses
      description: |
        Returns all candidate analyses pre-computed by the flagship agents
        (Bayesian scoring, contradiction detection, trajectory modeling).
        Each analysis carries reasoning chains, evidence attribution, and
        provenance for full auditability.
      responses:
        "200":
          description: Analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CandidateAnalysis"
  /intelligence/analyses/{candidateId}:
    get:
      operationId: getIntelligenceAnalysis
      tags: [intelligence]
      summary: Get a single candidate analysis
      parameters:
        - in: path
          name: candidateId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateAnalysis"
        "404":
          description: Not found
  /intelligence/cognition:
    get:
      operationId: listCognitiveSyntheses
      tags: [cognition]
      summary: List cross-agent cognitive syntheses
      description: |
        Returns the cognitive synthesis (influence propagation, disagreement,
        uncertainty fusion, reconciliation, archetype memory) for every
        candidate currently in the framework.
      responses:
        "200":
          description: Syntheses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CognitiveSynthesis"
  /intelligence/cognition/{candidateId}:
    get:
      operationId: getCognitiveSynthesis
      tags: [cognition]
      summary: Get a single cognitive synthesis
      parameters:
        - in: path
          name: candidateId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Synthesis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CognitiveSynthesis"
        "404":
          description: Not found
  /organization-intelligence/context:
    get:
      operationId: listOrganizationContexts
      tags: [organization-intelligence]
      summary: List organisation contexts
      responses:
        "200":
          description: Contexts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrganizationContext" }
  /organization-intelligence/context/{organizationId}:
    get:
      operationId: getOrganizationContext
      tags: [organization-intelligence]
      parameters:
        - in: path
          name: organizationId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationContext" }
        "404": { description: Not found }
  /organization-intelligence/fit/{organizationId}/{candidateId}:
    get:
      operationId: getCandidateOrganizationFit
      tags: [organization-intelligence]
      parameters:
        - { in: path, name: organizationId, required: true, schema: { type: string } }
        - { in: path, name: candidateId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Fit result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateOrganizationFitResult"
        "404": { description: Not found }
  /organization-intelligence/reports/{organizationId}/{candidateId}:
    get:
      operationId: getOrganizationIntelligenceReport
      tags: [organization-intelligence]
      parameters:
        - { in: path, name: organizationId, required: true, schema: { type: string } }
        - { in: path, name: candidateId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationIntelligenceReport"
        "404": { description: Not found }
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List generated reports
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
  /evaluation/report:
    get:
      operationId: getEvaluationReport
      tags: [evaluation]
      summary: Full evaluation, calibration, drift, and longitudinal-learning report
      responses:
        "200":
          description: Evaluation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationReport"
  /evaluation/outcomes:
    get:
      operationId: listEvaluationOutcomes
      tags: [evaluation]
      summary: List the append-only outcome events used to evaluate predictions
      responses:
        "200":
          description: Outcome events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutcomeEvent"
  /evaluation/predictions:
    get:
      operationId: listEvaluationPredictions
      tags: [evaluation]
      summary: List the prediction records that were evaluated against outcomes
      responses:
        "200":
          description: Prediction records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PredictionRecord"
  /operations/report:
    get:
      operationId: getOperationsReport
      tags: [operations]
      summary: Full intelligence-operations report (cases, audit, metrics)
      responses:
        "200":
          description: Operations report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsReport"
  /operations/cases:
    get:
      operationId: listIntelligenceCases
      tags: [operations]
      summary: List persistent intelligence cases
      responses:
        "200":
          description: Intelligence cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntelligenceCase"
  /operations/audit:
    get:
      operationId: listOperationsAudit
      tags: [operations]
      summary: Append-only operations audit timeline
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
  /benchmarks/report:
    get:
      operationId: getBenchmarkReport
      tags: [benchmarks]
      summary: Cognitive benchmark suite report (deterministic regression protection)
      responses:
        "200":
          description: Benchmark report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkReport"
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    SystemOverview:
      type: object
      required:
        [
          version,
          agents,
          skills,
          providers,
          workflows,
          memoryEntries,
          candidateNodes,
          organizationNodes,
          reports,
          uptimeSeconds,
        ]
      properties:
        version:
          type: string
        agents:
          type: integer
        skills:
          type: integer
        providers:
          type: integer
        workflows:
          type: integer
        memoryEntries:
          type: integer
        candidateNodes:
          type: integer
        organizationNodes:
          type: integer
        reports:
          type: integer
        uptimeSeconds:
          type: number
    Agent:
      type: object
      required: [id, name, role, status, capabilities, description]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        status:
          type: string
          enum: [active, idle, disabled]
        capabilities:
          type: array
          items: { type: string }
        description: { type: string }
        defaultProvider:
          type: ["string", "null"]
    Skill:
      type: object
      required: [id, name, category, inputs, outputs, description]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        inputs:
          type: array
          items: { type: string }
        outputs:
          type: array
          items: { type: string }
        description: { type: string }
    Provider:
      type: object
      required: [id, name, kind, models, status]
      properties:
        id: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [openai, anthropic, custom]
        models:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [configured, unconfigured]
    Workflow:
      type: object
      required: [id, name, trigger, steps, description]
      properties:
        id: { type: string }
        name: { type: string }
        trigger: { type: string }
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStep"
        description: { type: string }
    WorkflowStep:
      type: object
      required: [id, agentId, skillId]
      properties:
        id: { type: string }
        agentId: { type: string }
        skillId: { type: string }
        description:
          type: ["string", "null"]
    MemoryEntry:
      type: object
      required:
        [id, scope, subjectId, key, summary, createdAt, confidence, provenance]
      properties:
        id: { type: string }
        scope:
          type: string
          enum: [candidate, organization, role, global]
        subjectId: { type: string }
        key: { type: string }
        summary: { type: string }
        createdAt: { type: string, format: date-time }
        confidence: { type: number }
        sourceAgentId:
          type: ["string", "null"]
        tags:
          type: array
          items: { type: string }
        provenance:
          $ref: "#/components/schemas/Provenance"
    Provenance:
      type: object
      required: [producedBy, producedAt]
      properties:
        producedBy: { type: string }
        producedAt: { type: string, format: date-time }
        rationale:
          type: ["string", "null"]
        derivedFrom:
          type: array
          items: { type: string }
    GraphSnapshot:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdge"
    GraphNode:
      type: object
      required: [id, type, label]
      properties:
        id: { type: string }
        type: { type: string }
        label: { type: string }
        weight:
          type: ["number", "null"]
    GraphEdge:
      type: object
      required: [from, to, relation]
      properties:
        from: { type: string }
        to: { type: string }
        relation: { type: string }
        weight:
          type: ["number", "null"]
    Report:
      type: object
      required: [id, title, kind, createdAt, summary, sections, evidence]
      properties:
        id: { type: string }
        title: { type: string }
        kind:
          type: string
          enum: [candidate, role, organization, system]
        createdAt: { type: string, format: date-time }
        summary: { type: string }
        confidence:
          type: ["number", "null"]
        sections:
          type: array
          items:
            $ref: "#/components/schemas/ReportSection"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/ReportEvidence"
    ReportSection:
      type: object
      required: [heading, body]
      properties:
        heading: { type: string }
        body: { type: string }
    ReportEvidence:
      type: object
      required: [id, kind, summary, confidence, producedBy]
      properties:
        id: { type: string }
        kind: { type: string }
        summary: { type: string }
        confidence: { type: number }
        producedBy: { type: string }
    ReasoningStep:
      type: object
      required: [step, detail]
      properties:
        step: { type: string }
        detail: { type: string }
        value:
          type: ["number", "null"]
        derivedFrom:
          type: array
          items: { type: string }
    AgentReasoningEnvelope:
      type: object
      required:
        [agentId, candidateId, confidence, reasoning, evidenceChain, provenance]
      properties:
        agentId: { type: string }
        candidateId: { type: string }
        confidence: { type: number }
        reasoning:
          type: array
          items:
            $ref: "#/components/schemas/ReasoningStep"
        evidenceChain:
          type: array
          items: { type: string }
        provenance:
          $ref: "#/components/schemas/Provenance"
    BayesianFitResult:
      type: object
      required:
        [
          fitScore,
          prior,
          evidenceStrength,
          uncertaintyLevel,
          supportingEvidence,
          refutingEvidence,
          missingEvidence,
          perDomain,
        ]
      properties:
        fitScore: { type: number }
        prior: { type: number }
        evidenceStrength: { type: number }
        uncertaintyLevel: { type: number }
        supportingEvidence:
          type: array
          items:
            type: object
            required: [id, weight, summary]
            properties:
              id: { type: string }
              weight: { type: number }
              summary: { type: string }
        refutingEvidence:
          type: array
          items:
            type: object
            required: [id, weight, summary]
            properties:
              id: { type: string }
              weight: { type: number }
              summary: { type: string }
        missingEvidence:
          type: array
          items: { type: string }
        perDomain:
          type: array
          items:
            type: object
            required: [domain, supporting, refuting, logOddsDelta]
            properties:
              domain: { type: string }
              supporting: { type: integer }
              refuting: { type: integer }
              logOddsDelta: { type: number }
    Contradiction:
      type: object
      required: [id, kind, severity, domain, summary, derivedFrom]
      properties:
        id: { type: string }
        kind:
          type: string
          enum:
            [
              unsupported-claim,
              cross-source,
              shallow-reasoning,
              vocabulary-without-depth,
              fake-seniority,
            ]
        severity:
          type: string
          enum: [low, medium, high]
        domain: { type: string }
        summary: { type: string }
        derivedFrom:
          type: array
          items: { type: string }
    ContradictionResult:
      type: object
      required:
        [
          contradictionScore,
          contradictions,
          unsupportedClaims,
          weakSignals,
          verifiedSignals,
        ]
      properties:
        contradictionScore: { type: number }
        contradictions:
          type: array
          items:
            $ref: "#/components/schemas/Contradiction"
        unsupportedClaims:
          type: array
          items:
            type: object
            required: [claimId, summary]
            properties:
              claimId: { type: string }
              summary: { type: string }
        weakSignals:
          type: array
          items:
            type: object
            required: [id, summary]
            properties:
              id: { type: string }
              summary: { type: string }
        verifiedSignals:
          type: array
          items:
            type: object
            required: [id, summary]
            properties:
              id: { type: string }
              summary: { type: string }
    TrajectorySignal:
      type: object
      required: [id, rationale, derivedFrom]
      properties:
        id:
          type: string
          enum:
            [
              accelerating-builder,
              plateau-detected,
              emerging-elite,
              unusually-fast-progression,
              high-ownership-momentum,
              complexity-growth,
            ]
        rationale: { type: string }
        derivedFrom:
          type: array
          items: { type: string }
    TrajectoryRisk:
      type: object
      required: [id, severity, rationale]
      properties:
        id:
          type: string
          enum: [plateau, volatility, single-data-point, ownership-stagnation]
        severity:
          type: string
          enum: [low, medium, high]
        rationale: { type: string }
    TrajectoryResult:
      type: object
      required:
        [
          trajectoryScore,
          growthVelocity,
          acceleration,
          momentum,
          founderPotential,
          complexityCurve,
          trajectorySignals,
          risks,
        ]
      properties:
        trajectoryScore: { type: number }
        growthVelocity: { type: number }
        acceleration: { type: number }
        momentum: { type: number }
        founderPotential: { type: number }
        complexityCurve:
          type: array
          items:
            type: object
            required: [roleId, title, year, composite]
            properties:
              roleId: { type: string }
              title: { type: string }
              year: { type: number }
              composite: { type: number }
        trajectorySignals:
          type: array
          items:
            $ref: "#/components/schemas/TrajectorySignal"
        risks:
          type: array
          items:
            $ref: "#/components/schemas/TrajectoryRisk"
    BayesianReasoning:
      allOf:
        - $ref: "#/components/schemas/AgentReasoningEnvelope"
        - type: object
          required: [result]
          properties:
            result:
              $ref: "#/components/schemas/BayesianFitResult"
    ContradictionReasoning:
      allOf:
        - $ref: "#/components/schemas/AgentReasoningEnvelope"
        - type: object
          required: [result]
          properties:
            result:
              $ref: "#/components/schemas/ContradictionResult"
    TrajectoryReasoning:
      allOf:
        - $ref: "#/components/schemas/AgentReasoningEnvelope"
        - type: object
          required: [result]
          properties:
            result:
              $ref: "#/components/schemas/TrajectoryResult"
    CandidateAnalysis:
      type: object
      required:
        [
          candidateId,
          candidateName,
          targetRole,
          createdAt,
          bayesian,
          contradiction,
          trajectory,
        ]
      properties:
        candidateId: { type: string }
        candidateName: { type: string }
        targetRole: { type: string }
        createdAt: { type: string, format: date-time }
        bayesian:
          $ref: "#/components/schemas/BayesianReasoning"
        contradiction:
          $ref: "#/components/schemas/ContradictionReasoning"
        trajectory:
          $ref: "#/components/schemas/TrajectoryReasoning"
    InfluenceKind:
      type: string
      enum:
        - confidence-penalty
        - confidence-amplification
        - uncertainty-boost
        - evidence-reinforcement
        - contradiction-pressure
    CertaintyCategory:
      type: string
      enum:
        - high-confidence-positive
        - high-confidence-negative
        - uncertain-positive
        - uncertain-negative
        - ambiguous
    RecommendationCategory:
      type: string
      enum: [advance, investigate, decline, ambiguous]
    AgentNode:
      type: object
      required: [id, name, initialConfidence, adjustedConfidence, metric]
      properties:
        id: { type: string }
        name: { type: string }
        initialConfidence: { type: number }
        adjustedConfidence: { type: number }
        metric:
          type: object
          required: [name, value]
          properties:
            name: { type: string }
            value: { type: number }
    InfluenceEdge:
      type: object
      required: [id, from, to, kind, weight, reason]
      properties:
        id: { type: string }
        from: { type: string }
        to: { type: string }
        kind: { $ref: "#/components/schemas/InfluenceKind" }
        weight: { type: number }
        reason: { type: string }
    PropagatedInfluence:
      type: object
      required:
        [
          id,
          sourceAgent,
          targetAgent,
          kind,
          reason,
          adjustment,
          before,
          after,
          derivedFrom,
        ]
      properties:
        id: { type: string }
        sourceAgent: { type: string }
        targetAgent: { type: string }
        kind: { $ref: "#/components/schemas/InfluenceKind" }
        reason: { type: string }
        adjustment: { type: number }
        before: { type: number }
        after: { type: number }
        derivedFrom:
          type: array
          items: { type: string }
    Disagreement:
      type: object
      required: [id, agentA, agentB, metricA, metricB, score, rationale]
      properties:
        id: { type: string }
        agentA: { type: string }
        agentB: { type: string }
        metricA:
          type: object
          required: [name, value]
          properties:
            name: { type: string }
            value: { type: number }
        metricB:
          type: object
          required: [name, value]
          properties:
            name: { type: string }
            value: { type: number }
        score: { type: number }
        rationale: { type: string }
    ConfidencePropagation:
      type: object
      required:
        [globalConfidence, localAdjustments, uncertaintyMap, saturationApplied]
      properties:
        globalConfidence: { type: number }
        localAdjustments:
          type: object
          additionalProperties: { type: number }
        uncertaintyMap:
          type: object
          additionalProperties: { type: number }
        saturationApplied: { type: boolean }
    DisagreementAnalysis:
      type: object
      required:
        [
          disagreementScore,
          disagreements,
          unresolvedQuestions,
          ambiguityLevel,
          confidenceTension,
        ]
      properties:
        disagreementScore: { type: number }
        disagreements:
          type: array
          items: { $ref: "#/components/schemas/Disagreement" }
        unresolvedQuestions:
          type: array
          items: { type: string }
        ambiguityLevel: { type: number }
        confidenceTension: { type: number }
    UncertaintyFusion:
      type: object
      required:
        [
          certaintyCategory,
          uncertaintyLevel,
          ambiguityScore,
          evidenceReliability,
          confidenceDistribution,
        ]
      properties:
        certaintyCategory: { $ref: "#/components/schemas/CertaintyCategory" }
        uncertaintyLevel: { type: number }
        ambiguityScore: { type: number }
        evidenceReliability: { type: number }
        confidenceDistribution:
          type: object
          additionalProperties: { type: number }
    ReconciliationSynthesis:
      type: object
      required:
