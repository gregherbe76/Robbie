          items: { $ref: "#/components/schemas/IngestionJob" }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/IngestionEvidenceItem" }
        lineage:
          type: array
          items: { $ref: "#/components/schemas/IngestionEvidenceLineageNode" }
        auditEntries:
          type: array
          items: { $ref: "#/components/schemas/IngestionAuditEntry" }
