openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: |
    Recruiting Intelligence Framework — control plane API.
    Exposes registries (agents, skills, providers, workflows), memory introspection,
    graph snapshots, reports and the system overview used by the console.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: system
    description: Framework-wide overview and telemetry
  - name: registry
    description: Registered components (agents, skills, providers, workflows)
  - name: memory
    description: Persistent memory introspection
  - name: graph
    description: Candidate and organization graph snapshots
  - name: reports
    description: Generated reports and explanations
  - name: intelligence
    description: Flagship intelligence agent analyses
  - name: cognition
    description: Cross-agent cognitive synthesis (influence, disagreement, uncertainty)
  - name: benchmarks
    description: Cognitive benchmark + smoke-test report (deterministic regression protection)
  - name: demo
    description: Public demo replay — deterministic end-to-end traces for the 5 hero cases
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /system/overview:
    get:
      operationId: getSystemOverview
      tags: [system]
      summary: Framework overview
      description: High-level counts and status across all framework modules
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemOverview"
  /registry/agents:
    get:
      operationId: listAgents
      tags: [registry]
      summary: List registered agents
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
  /registry/skills:
    get:
      operationId: listSkills
      tags: [registry]
      summary: List registered skills
      responses:
        "200":
          description: Skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"
  /registry/providers:
    get:
      operationId: listProviders
      tags: [registry]
      summary: List registered AI providers
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Provider"
  /registry/workflows:
    get:
      operationId: listWorkflows
      tags: [registry]
      summary: List registered workflows
      responses:
        "200":
          description: Workflows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workflow"
  /memory/entries:
    get:
      operationId: listMemoryEntries
      tags: [memory]
      summary: Recent persistent memory entries
      responses:
        "200":
          description: Memory entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemoryEntry"
  /graph/candidate:
    get:
      operationId: getCandidateGraph
      tags: [graph]
      summary: Candidate graph snapshot
      responses:
        "200":
          description: Graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphSnapshot"
  /graph/organization:
    get:
      operationId: getOrganizationGraph
      tags: [graph]
      summary: Organization graph snapshot
      responses:
        "200":
          description: Graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphSnapshot"
  /intelligence/analyses:
    get:
      operationId: listIntelligenceAnalyses
      tags: [intelligence]
      summary: List candidate intelligence analyses
      description: |
        Returns all candidate analyses pre-computed by the flagship agents
        (Bayesian scoring, contradiction detection, trajectory modeling).
        Each analysis carries reasoning chains, evidence attribution, and
        provenance for full auditability.
      responses:
        "200":
          description: Analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CandidateAnalysis"
  /intelligence/analyses/{candidateId}:
    get:
      operationId: getIntelligenceAnalysis
      tags: [intelligence]
      summary: Get a single candidate analysis
      parameters:
        - in: path
          name: candidateId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateAnalysis"
        "404":
          description: Not found
  /intelligence/cognition:
    get:
      operationId: listCognitiveSyntheses
      tags: [cognition]
      summary: List cross-agent cognitive syntheses
      description: |
        Returns the cognitive synthesis (influence propagation, disagreement,
        uncertainty fusion, reconciliation, archetype memory) for every
        candidate currently in the framework.
      responses:
        "200":
          description: Syntheses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CognitiveSynthesis"
  /intelligence/cognition/{candidateId}:
    get:
      operationId: getCognitiveSynthesis
      tags: [cognition]
      summary: Get a single cognitive synthesis
      parameters:
        - in: path
          name: candidateId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Synthesis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CognitiveSynthesis"
        "404":
          description: Not found
  /organization-intelligence/context:
    get:
      operationId: listOrganizationContexts
      tags: [organization-intelligence]
      summary: List organisation contexts
      responses:
        "200":
          description: Contexts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrganizationContext" }
  /organization-intelligence/context/{organizationId}:
    get:
      operationId: getOrganizationContext
      tags: [organization-intelligence]
      parameters:
        - in: path
          name: organizationId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationContext" }
        "404": { description: Not found }
  /organization-intelligence/fit/{organizationId}/{candidateId}:
    get:
      operationId: getCandidateOrganizationFit
      tags: [organization-intelligence]
      parameters:
        - { in: path, name: organizationId, required: true, schema: { type: string } }
        - { in: path, name: candidateId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Fit result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateOrganizationFitResult"
        "404": { description: Not found }
  /organization-intelligence/reports/{organizationId}/{candidateId}:
    get:
      operationId: getOrganizationIntelligenceReport
      tags: [organization-intelligence]
      parameters:
        - { in: path, name: organizationId, required: true, schema: { type: string } }
        - { in: path, name: candidateId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationIntelligenceReport"
        "404": { description: Not found }
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List generated reports
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
  /evaluation/report:
    get:
      operationId: getEvaluationReport
      tags: [evaluation]
      summary: Full evaluation, calibration, drift, and longitudinal-learning report
      responses:
        "200":
          description: Evaluation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationReport"
  /evaluation/outcomes:
    get:
      operationId: listEvaluationOutcomes
      tags: [evaluation]
      summary: List the append-only outcome events used to evaluate predictions
      responses:
        "200":
          description: Outcome events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutcomeEvent"
  /evaluation/predictions:
    get:
      operationId: listEvaluationPredictions
      tags: [evaluation]
      summary: List the prediction records that were evaluated against outcomes
      responses:
        "200":
          description: Prediction records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PredictionRecord"
  /operations/report:
    get:
      operationId: getOperationsReport
      tags: [operations]
      summary: Full intelligence-operations report (cases, audit, metrics)
      responses:
        "200":
          description: Operations report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsReport"
  /operations/cases:
    get:
      operationId: listIntelligenceCases
      tags: [operations]
      summary: List persistent intelligence cases
      responses:
        "200":
          description: Intelligence cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntelligenceCase"
  /operations/audit:
    get:
      operationId: listOperationsAudit
      tags: [operations]
      summary: Append-only operations audit timeline
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
  /benchmarks/report:
    get:
      operationId: getBenchmarkReport
      tags: [benchmarks]
      summary: Cognitive benchmark suite report (deterministic regression protection)
      responses:
        "200":
          description: Benchmark report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkReport"
  /ingestion/state:
    get:
      operationId: getIngestionState
      tags: [ingestion]
      summary: Full ingestion state (jobs, candidate results, organization results)
      responses:
        "200":
          description: Gateway state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionStateResponse"
  /ingestion/candidate:
    post:
      operationId: ingestCandidate
      tags: [ingestion]
      summary: Ingest candidate evidence from one or more raw sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestCandidateRequest"
      responses:
        "200":
          description: Candidate pipeline result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidatePipelineResult"
  /ingestion/organization:
    post:
      operationId: ingestOrganization
      tags: [ingestion]
      summary: Ingest organization context from one or more sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestOrganizationRequest"
      responses:
        "200":
          description: Organization pipeline result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationPipelineResult"
  /ingestion/transcript:
    post:
      operationId: ingestTranscript
      tags: [ingestion]
      summary: Ingest a single interview transcript for a candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestTranscriptRequest"
      responses:
        "200":
          description: Candidate pipeline result (transcript-only run)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidatePipelineResult"
  /ingestion/events/{id}:
    get:
      operationId: getIngestionEvent
      tags: [ingestion]
      summary: Retrieve a single ingestion job and its full pipeline result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ingestion event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionEventDetail"
        "404":
          description: Not found
  /ingestion/audit/{candidateId}:
    get:
      operationId: getIngestionAudit
      tags: [ingestion]
      summary: Replayable ingestion audit log + evidence lineage for a subject
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ingestion audit bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionAuditBundle"
  /collaboration/state:
    get:
      operationId: getCollaborationState
      tags: [collaboration]
      summary: Full collaboration snapshot — reviewers, cases, disagreements, overrides, audit, organizational memory
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationStateResponse"
  /collaboration/cases:
    post:
      operationId: openCollaborationCase
      tags: [collaboration]
      summary: Open a new collaborative case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenCollaborationCaseRequest"
      responses:
        "200":
          description: Opened case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborativeCase"
  /collaboration/cases/{id}:
    get:
      operationId: getCollaborationCase
      tags: [collaboration]
      summary: Get a collaborative case with its full reasoning bundle
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Case detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationCaseDetail"
        "404":
          description: Not found
  /collaboration/cases/{id}/review:
    post:
      operationId: recordCollaborationReview
      tags: [collaboration]
      summary: Record a reviewer action against a case
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollaborationReviewRequest"
      responses:
        "200":
          description: Review accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationReviewResult"
  /collaboration/cases/{id}/override:
    post:
      operationId: recordCollaborationOverride
      tags: [collaboration]
      summary: Issue an explicit override against a case recommendation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollaborationOverrideRequest"
      responses:
        "200":
          description: Override recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationOverrideRecord"
  /collaboration/cases/{id}/evidence-review:
    post:
      operationId: recordCollaborationEvidenceReview
      tags: [collaboration]
      summary: Annotate, challenge, or adjust reliability of a piece of evidence in the context of a case
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollaborationEvidenceReviewRequest"
      responses:
        "200":
          description: Evidence review recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationEvidenceReviewEntry"
  /collaboration/reviewer/{id}/calibration:
    get:
      operationId: getCollaborationReviewerCalibration
      tags: [collaboration]
      summary: Reviewer calibration report (contextual, per-domain)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Reviewer calibration report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationReviewerCalibrationReport"
        "404":
          description: Not found
  /collaboration/audit/{caseId}:
    get:
      operationId: getCollaborationAudit
      tags: [collaboration]
      summary: Append-only collaboration audit bundle for a case
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Audit bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationAuditBundle"
        "404":
          description: Not found
  /security/access-log/{organizationId}:
    get:
      operationId: getSecurityAccessLog
      tags: [security]
      summary: Recent access decisions for an organization (audit-first view)
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Access log bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityAccessLog"
        "404":
          description: Organization not found
  /security/reviewer/{reviewerId}:
    get:
      operationId: getSecurityReviewer
      tags: [security]
      summary: Reviewer identity, capabilities, and recent decisions
      parameters:
        - name: reviewerId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Reviewer detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityReviewerDetail"
        "404":
          description: Reviewer not found
  /security/check-access:
    post:
      operationId: checkSecurityAccess
      tags: [security]
      summary: Probe the central access decision engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityCheckAccessRequest"
      responses:
        "200":
          description: Access decision (allowed or denied with rule trace)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityAccessDecision"
  /security/visibility/{resourceId}:
    get:
      operationId: getSecurityVisibility
      tags: [security]
      summary: Current visibility level + full append-only history
      parameters:
        - name: resourceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Visibility detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityVisibilityDetail"
        "404":
          description: Resource not found
  /security/change-visibility:
    post:
      operationId: changeSecurityVisibility
      tags: [security]
      summary: Change a resource's visibility level (auditable)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityChangeVisibilityRequest"
      responses:
        "200":
          description: Change applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityChangeVisibilityResult"
        "403":
          description: Denied by access decision engine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityAccessDecision"
  /security/audit/{organizationId}:
    get:
      operationId: getSecurityAudit
      tags: [security]
      summary: Append-only security audit for an organization
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Audit bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityAuditBundle"
        "404":
          description: Organization not found
  /security/snapshot/{organizationId}:
    get:
      operationId: getSecuritySnapshot
      tags: [security]
      summary: Operator-facing security snapshot (orgs, reviewers, visibility, decisions, audit, sensitive, benchmarks)
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Security snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuritySnapshot"
        "404":
          description: Organization not found
  /demo/cases:
    get:
      operationId: listDemoCases
      tags: [demo]
      summary: List public demo cases
      description: Returns the 5 deterministic hero cases used by the public replay UI.
      responses:
        "200":
          description: Cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DemoCaseSummary"
  /demo/replay/{caseId}:
    get:
      operationId: getDemoReplay
      tags: [demo]
      summary: Run a demo case live and return its full trace
      description: |
        Runs the real framework pipeline (ingestion → flagship agents → cognition →
        organization-intelligence) for the requested case and returns a deterministic
        replay trace. The trace shape is documented by the TypeScript
        `ReplayTrace` type in `@workspace/framework/replay`; this endpoint returns
        an opaque object that round-trips that type.
      parameters:
        - name: caseId
          in: path
          required: true
          description: One of the 5 demo case ids.
          schema:
            type: string
            enum:
              - founder-builder
              - inflated-senior
              - ambiguous-generalist
              - chaos-thriver
              - org-mismatch
      responses:
        "200":
          description: Replay trace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoReplayTrace"
        "404":
          description: Unknown case id
components:
  schemas:
    SecurityOrganizationTier:
      type: string
      enum: [founder, growth, enterprise, demo]
    SecurityVisibilityScope:
      type: string
      enum: [organization, global_demo, global_benchmark]
    SecurityReviewerType:
      type: string
      enum:
        - founder
        - recruiter
        - hiring_manager
        - technical_reviewer
        - executive
        - external_reviewer
        - system_agent
    SecurityCapability:
      type: string
      enum:
        - review_evidence
        - escalate_case
        - override_recommendation
        - view_sensitive_evidence
        - run_benchmarks
        - manage_org_memory
        - view_calibration
        - create_public_benchmark
    SecurityVisibilityLevel:
      type: string
      enum:
        - organization_private
        - investigation_private
        - reviewer_private
        - escalation_only
        - benchmark_public
        - demo_public
    SecurityAccessAction:
      type: string
      enum:
        - read
        - write
        - override
        - escalate
        - view_sensitive
        - modify_visibility
        - modify_benchmark
        - manage_memory
    SecurityAccessRuleKind:
      type: string
      enum:
        - organization_boundary
        - capability
        - visibility
        - escalation_restriction
        - reviewer_identity
        - session_integrity
    SecurityAuditKind:
      type: string
      enum:
        - access_attempt
        - access_denied
        - visibility_change
        - override_action
        - escalation_access
        - evidence_access
        - sensitive_evidence_view
        - calibration_access
        - benchmark_modification
        - session_opened
        - session_closed
        - action_signed
        - reviewer_registered
    SecurityEvidenceSensitivity:
      type: string
      enum:
        - public
        - internal
        - founder_only
        - escalation_only
        - confidential_investigation
    SecurityBenchmarkScenarioId:
      type: string
      enum:
        - cross_org_access_attempt
        - unauthorized_escalation_access
        - override_without_capability
        - visibility_leakage
        - benchmark_contamination
        - reviewer_impersonation
        - sensitive_evidence_access
        - hidden_audit_mutation
    SecurityProvenance:
      type: object
      required: [sourceKind, sourceId, createdBy, createdAt]
      properties:
        sourceKind:
          type: string
          enum: [ingestion, cognition, reviewer, agent, benchmark, system]
        sourceId: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    SecurityOrganization:
      type: object
      required: [organizationId, displayName, tier, createdAt, calibrationNamespace]
      properties:
        organizationId: { type: string }
        displayName: { type: string }
        tier: { $ref: "#/components/schemas/SecurityOrganizationTier" }
        createdAt: { type: string, format: date-time }
        calibrationNamespace: { type: string }
    SecurityReviewerIdentity:
      type: object
      required:
        - reviewerId
        - organizationId
        - reviewerType
        - displayName
        - fingerprint
        - capabilities
        - calibrationIdentityKey
        - createdAt
        - scopedToInvestigationId
      properties:
        reviewerId: { type: string }
        organizationId: { type: string }
        reviewerType: { $ref: "#/components/schemas/SecurityReviewerType" }
        displayName: { type: string }
        fingerprint: { type: string }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/SecurityCapability" }
        calibrationIdentityKey: { type: string }
        createdAt: { type: string, format: date-time }
        scopedToInvestigationId:
          type: string
          nullable: true
    SecurityVisibilityRecord:
      type: object
      required:
        - resourceId
        - resourceKind
        - organizationId
        - level
        - scopedInvestigationId
        - scopedReviewerId
        - changedBy
        - changedAt
        - reason
