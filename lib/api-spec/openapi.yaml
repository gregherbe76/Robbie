    IngestionNormalizedOrganization:
      type: object
      required: [organizationId, displayName, fields, unknowns]
      properties:
        organizationId: { type: string }
        displayName: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/IngestionNormalizedOrgField" }
        unknowns:
          type: array
          items: { type: string }
    IngestionJob:
