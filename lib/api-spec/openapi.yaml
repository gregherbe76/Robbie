      required: [id, kind, name, confidence, recommendation, rationale]
      properties:
        id: { type: string }
        kind: { type: string, enum: [agent, human, panel] }
        name: { type: string }
        confidence: { type: number }
        recommendation:
          type: string
          enum: [advance, investigate, decline, abstain]
        rationale: { type: string }
    ReasoningCluster:
      type: object
      required: [id, label, reviewers, sharedClaim, weight]
      properties:
        id: { type: string }
        label: { type: string }
        reviewers: { type: array, items: { type: string } }
        sharedClaim: { type: string }
        weight: { type: number }
    ConsensusReport:
      type: object
      required:
        [
          caseId,
          reviewers,
          consensusAreas,
          disagreementAreas,
          unresolvedQuestions,
          reviewerConfidenceDistribution,
          reasoningClusters,
          finalDecisionState,
        ]
      properties:
        caseId: { type: string }
        reviewers:
          type: array
          items: { $ref: "#/components/schemas/Reviewer" }
        consensusAreas: { type: array, items: { type: string } }
        disagreementAreas: { type: array, items: { type: string } }
        unresolvedQuestions: { type: array, items: { type: string } }
        reviewerConfidenceDistribution:
          type: array
          items:
            type: object
            required: [reviewerId, confidence, recommendation]
            properties:
              reviewerId: { type: string }
              confidence: { type: number }
              recommendation:
                type: string
                enum: [advance, investigate, decline, abstain]
        reasoningClusters:
          type: array
          items: { $ref: "#/components/schemas/ReasoningCluster" }
        finalDecisionState: { $ref: "#/components/schemas/DecisionState" }
    AuditEvent:
      type: object
      required: [id, caseId, at, actor, kind, summary, relatedRefIds]
      properties:
        id: { type: string }
        caseId: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string }
        kind:
          type: string
          enum:
            [
              case-opened,
              investigation-opened,
              investigation-state-changed,
              evidence-requested,
              hypothesis-added,
              hypothesis-updated,
              adversarial-review-added,
              escalation-raised,
              human-annotation,
              decision-state-changed,
              calibration-warning,
              longitudinal-update,
            ]
        summary: { type: string }
        confidenceBefore: { type: number }
        confidenceAfter: { type: number }
        relatedRefIds: { type: array, items: { type: string } }
    IntelligenceCase:
      type: object
      required:
        [
          id,
          candidateId,
          candidateName,
          organizationId,
          targetRole,
          createdAt,
          decisionState,
          decisionStateRationale,
          workflow,
          investigations,
          evidenceRequests,
          hypotheses,
          adversarialReviews,
          escalations,
          humanAnnotations,
          consensus,
          calibrationWarnings,
          longitudinalUpdates,
          unresolvedQuestionCount,
          openEvidenceRequestCount,
          openInvestigationCount,
          competingHypothesisCount,
          escalationSeverityMax,
          effectiveConfidence,
        ]
      properties:
        id: { type: string }
        candidateId: { type: string }
        candidateName: { type: string }
        organizationId: { type: string }
        targetRole: { type: string }
        createdAt: { type: string, format: date-time }
        decisionState: { $ref: "#/components/schemas/DecisionState" }
        decisionStateRationale: { type: string }
        workflow: { $ref: "#/components/schemas/DecisionReviewWorkflowState" }
        investigations:
          type: array
          items: { $ref: "#/components/schemas/Investigation" }
        evidenceRequests:
          type: array
          items: { $ref: "#/components/schemas/EvidenceRequest" }
        hypotheses:
          type: array
          items: { $ref: "#/components/schemas/Hypothesis" }
        adversarialReviews:
          type: array
          items: { $ref: "#/components/schemas/AdversarialReview" }
        escalations:
          type: array
          items: { $ref: "#/components/schemas/Escalation" }
        humanAnnotations:
          type: array
          items: { $ref: "#/components/schemas/HumanAnnotation" }
        consensus: { $ref: "#/components/schemas/ConsensusReport" }
        calibrationWarnings: { type: array, items: { type: string } }
        longitudinalUpdates: { type: array, items: { type: string } }
        unresolvedQuestionCount: { type: integer }
        openEvidenceRequestCount: { type: integer }
        openInvestigationCount: { type: integer }
        competingHypothesisCount: { type: integer }
        escalationSeverityMax:
          oneOf:
            - { type: string, enum: [low, medium, high, critical] }
            - { type: "null" }
        effectiveConfidence: { type: number }
    OperationsMetrics:
      type: object
      required:
        [
          totalCases,
          casesByDecisionState,
          openInvestigations,
          pendingEvidenceRequests,
          activeEscalations,
          unresolvedHypotheses,
          competingHypothesisPairs,
          averageEffectiveConfidence,
          humanInterventions,
          prematureCertaintyGuardsTriggered,
        ]
      properties:
        totalCases: { type: integer }
        casesByDecisionState:
          type: object
          required:
            [
              initial_assessment,
              investigation_required,
              adversarial_review,
              human_review,
              evidence_pending,
              calibration_warning,
              decision_ready,
              unresolved,
            ]
          properties:
            initial_assessment: { type: integer }
            investigation_required: { type: integer }
            adversarial_review: { type: integer }
            human_review: { type: integer }
            evidence_pending: { type: integer }
            calibration_warning: { type: integer }
            decision_ready: { type: integer }
            unresolved: { type: integer }
        openInvestigations: { type: integer }
        pendingEvidenceRequests: { type: integer }
        activeEscalations: { type: integer }
        unresolvedHypotheses: { type: integer }
        competingHypothesisPairs: { type: integer }
        averageEffectiveConfidence: { type: number }
        humanInterventions: { type: integer }
        prematureCertaintyGuardsTriggered: { type: integer }
    OperationsReport:
      type: object
      required: [generatedAt, generatedBy, cases, audit, metrics]
      properties:
        generatedAt: { type: string, format: date-time }
        generatedBy: { type: string }
        cases:
          type: array
          items: { $ref: "#/components/schemas/IntelligenceCase" }
        audit:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        metrics: { $ref: "#/components/schemas/OperationsMetrics" }
    BenchmarkScenarioDigest:
      type: object
      required:
        [scenarioId, candidateId, organizationId, bayesianFit, bayesianConfidence,
         contradictionScore, contradictionCount, unsupportedClaimCount, trajectoryScore,
         trajectoryConfidence, globalConfidence, disagreementScore, ambiguityLevel,
         certaintyCategory, recommendationCategory, unresolvedQuestionCount,
         influenceCount, evidenceChainCount, reasoningStepCount, archetypeMatchCount,
         fitRecommendation, fitConfidence, overallHiringRisk, chaosFitScore,
         evidenceRequestSignal]
      properties:
        scenarioId: { type: string }
        candidateId: { type: string }
        organizationId: { type: string }
        bayesianFit: { type: number }
        bayesianConfidence: { type: number }
        contradictionScore: { type: number }
        contradictionCount: { type: integer }
        unsupportedClaimCount: { type: integer }
        trajectoryScore: { type: number }
        trajectoryConfidence: { type: number }
        globalConfidence: { type: number }
        disagreementScore: { type: number }
        ambiguityLevel: { type: number }
        certaintyCategory: { type: string }
        recommendationCategory: { type: string }
        unresolvedQuestionCount: { type: integer }
        influenceCount: { type: integer }
        evidenceChainCount: { type: integer }
        reasoningStepCount: { type: integer }
        archetypeMatchCount: { type: integer }
        fitRecommendation: { type: string }
        fitConfidence: { type: number }
        overallHiringRisk: { type: number }
        chaosFitScore: { type: number }
        evidenceRequestSignal: { type: integer }
    BenchmarkExpectationFailure:
      type: object
      required: [type, passed, detail]
      properties:
        type: { type: string }
        path: { type: string }
        passed: { type: boolean }
        detail: { type: string }
        rationale: { type: string }
    BenchmarkDeterminismCheck:
      type: object
      required: [scenarioId, passed, firstHash, secondHash, drift]
      properties:
        scenarioId: { type: string }
        passed: { type: boolean }
        firstHash: { type: string }
        secondHash: { type: string }
        drift:
          type: array
          items: { type: string }
    BenchmarkCognitionIntegrityCheck:
      type: object
      required: [scenarioId, passed, findings]
      properties:
        scenarioId: { type: string }
        passed: { type: boolean }
        findings:
          type: array
          items:
            type: object
            required: [ok, rule, detail]
            properties:
              ok: { type: boolean }
              rule: { type: string }
              detail: { type: string }
    BenchmarkProvenanceCheck:
      type: object
      required: [ok, findings]
      properties:
        ok: { type: boolean }
        findings:
          type: array
          items:
            type: object
            required: [ok, path, detail]
            properties:
              ok: { type: boolean }
              path: { type: string }
              detail: { type: string }
    BenchmarkScenarioResult:
      type: object
      required:
        [scenarioId, archetype, passed, description, determinismHash, digest,
         failures, warnings, determinism, cognitionIntegrity, provenance]
      properties:
        scenarioId: { type: string }
        archetype: { type: string }
        description: { type: string }
        passed: { type: boolean }
        determinismHash: { type: string }
        digest: { $ref: "#/components/schemas/BenchmarkScenarioDigest" }
        failures:
          type: array
          items: { $ref: "#/components/schemas/BenchmarkExpectationFailure" }
        warnings:
          type: array
          items: { type: string }
        determinism: { $ref: "#/components/schemas/BenchmarkDeterminismCheck" }
        cognitionIntegrity: { $ref: "#/components/schemas/BenchmarkCognitionIntegrityCheck" }
        provenance: { $ref: "#/components/schemas/BenchmarkProvenanceCheck" }
    BenchmarkSummary:
      type: object
      required:
        [totalScenarios, passed, failed, determinismOk, provenanceOk,
         calibrationOk, snapshotOk, mutationGuardsOk]
      properties:
        totalScenarios: { type: integer }
        passed: { type: integer }
        failed: { type: integer }
        determinismOk: { type: boolean }
        provenanceOk: { type: boolean }
        calibrationOk: { type: boolean }
        snapshotOk: { type: boolean }
        mutationGuardsOk: { type: boolean }
    BenchmarkCalibration:
      type: object
      required: [passed, ece, overconfidenceRisk, predictionsEvaluated, detail, reasons]
      properties:
        passed: { type: boolean }
        ece: { type: number }
        overconfidenceRisk:
          type: string
          enum: [low, medium, high]
        predictionsEvaluated: { type: integer }
        detail: { type: string }
        reasons:
          type: array
          items: { type: string }
    BenchmarkSnapshotDrift:
      type: object
      required: [ok, drift]
      properties:
        ok: { type: boolean }
        drift:
          type: array
          items:
            type: object
            required: [scenarioId, kind, detail]
            properties:
              scenarioId: { type: string }
              kind:
                type: string
                enum: [missing, extra, hash-changed, field-changed]
              detail: { type: string }
    BenchmarkMutationGuard:
      type: object
      required: [guardId, description, passed, scenarioId, detail]
      properties:
        guardId: { type: string }
        description: { type: string }
        passed: { type: boolean }
        scenarioId: { type: string }
        detail: { type: string }
    BenchmarkReport:
      type: object
      required:
        [generatedAt, generatedBy, summary, scenarios, calibration, snapshot,
         mutationGuards, recommendations]
      properties:
        generatedAt: { type: string, format: date-time }
        generatedBy: { type: string }
        summary: { $ref: "#/components/schemas/BenchmarkSummary" }
        scenarios:
          type: array
          items: { $ref: "#/components/schemas/BenchmarkScenarioResult" }
        calibration: { $ref: "#/components/schemas/BenchmarkCalibration" }
        snapshot: { $ref: "#/components/schemas/BenchmarkSnapshotDrift" }
        mutationGuards:
          type: array
          items: { $ref: "#/components/schemas/BenchmarkMutationGuard" }
        recommendations:
          type: array
          items: { type: string }
    IngestionProvenance:
      type: object
      required: [producedBy, producedAt]
      properties:
        producedBy: { type: string }
        producedAt: { type: string, format: date-time }
        rationale: { type: string }
        derivedFrom:
          type: array
          items: { type: string }
    IngestionRawReference:
      type: object
      required: [locator]
      properties:
        locator: { type: string }
        excerpt: { type: string }
    IngestionEvidenceItem:
      type: object
      required:
        [id, kind, claim, subjectId, attributes, confidence, reliability,
         ambiguity, provenance, rawReference]
      properties:
        id: { type: string }
        kind:
          type: string
          enum:
            - explicit_claim
            - demonstrated_behavior
            - contradiction_signal
            - uncertainty_signal
            - ownership_signal
            - trajectory_signal
            - organizational_signal
        claim: { type: string }
        subjectId: { type: string }
        attributes:
          type: object
          additionalProperties: true
        confidence: { type: number }
        reliability: { type: number }
        ambiguity:
          type: array
          items: { type: string }
        provenance: { $ref: "#/components/schemas/IngestionProvenance" }
        rawReference: { $ref: "#/components/schemas/IngestionRawReference" }
        derivedFromEvidenceIds:
          type: array
          items: { type: string }
    IngestionReliabilityFactor:
      type: object
      required: [factor, delta, rationale]
      properties:
        factor: { type: string }
        delta: { type: number }
        rationale: { type: string }
    IngestionSourceReliability:
      type: object
      required:
        [sourceKind, rawId, reliabilityScore, reliabilityFactors, uncertainty,
         conflictsDetected, rationale]
      properties:
        sourceKind: { type: string }
        rawId: { type: string }
        reliabilityScore: { type: number }
        reliabilityFactors:
          type: array
          items: { $ref: "#/components/schemas/IngestionReliabilityFactor" }
        uncertainty:
          type: array
          items: { type: string }
        conflictsDetected: { type: integer }
        rationale: { type: string }
    IngestionEvidenceConflict:
      type: object
      required:
        [id, description, severity, impactedEvidenceIds, unresolvedQuestions,
         recommendedInvestigation, detectedAt]
      properties:
        id: { type: string }
        description: { type: string }
        severity:
          type: string
          enum: [low, medium, high]
        impactedEvidenceIds:
          type: array
          items: { type: string }
        unresolvedQuestions:
          type: array
          items: { type: string }
        recommendedInvestigation: { type: string }
        detectedAt: { type: string, format: date-time }
    IngestionWarning:
      type: object
      required: [code, detail, severity]
      properties:
        code: { type: string }
        detail: { type: string }
        severity:
          type: string
          enum: [info, warn, error]
    IngestionAuditEntry:
      type: object
      required: [id, jobId, type, occurredAt, sourceKind, rawId, detail]
      properties:
        id: { type: string }
        jobId: { type: string }
        type: { type: string }
        occurredAt: { type: string, format: date-time }
        sourceKind: { type: string }
        rawId: { type: string }
        detail: { type: string }
        data:
          type: object
          additionalProperties: true
    IngestionNormalizedCandidateRole:
