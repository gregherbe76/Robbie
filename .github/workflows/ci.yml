name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck + benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (full workspace)
        # Builds composite libs, then typechecks every leaf workspace package.
        # This is the canonical correctness check.
        run: pnpm run typecheck

      - name: Cognition benchmark (deterministic guards)
        # Runs the 10 scenarios across the 5 guard categories
        # (determinism, provenance, calibration, snapshot, guards).
        # A failure here means framework behavior drifted.
        run: pnpm benchmark:cognition

      - name: Cognitive smoke suite
        # Fast gated variant of the cognition benchmark, intended for CI.
        run: pnpm test:cognitive-smoke

      - name: Verify OpenAPI codegen is in sync
        # Regenerate, then assert no diff. PRs that modify the OpenAPI spec
        # must commit the regenerated artifacts.
        run: |
          pnpm --filter @workspace/api-spec run codegen
          if ! git --no-optional-locks diff --quiet --exit-code; then
            echo "::error::OpenAPI codegen produced uncommitted changes."
            echo "Run 'pnpm --filter @workspace/api-spec run codegen' locally and commit the result."
            git --no-optional-locks diff --stat
            exit 1
          fi

      - name: Verify cognition snapshots are in sync
        # The cognition benchmark must not silently mutate snapshots.
        # If anything changed on disk during the run, fail loudly.
        run: |
          if ! git --no-optional-locks diff --quiet --exit-code; then
            echo "::error::Cognition snapshots changed during CI run."
            echo "Snapshot updates must be intentional (pnpm benchmark:cognition:update)."
            git --no-optional-locks diff --stat
            exit 1
          fi
